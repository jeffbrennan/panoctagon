name: Svelte dashboard
on:
  push:
  pull_request:
concurrency:
  group: svelte-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.12
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npm run check && npm test && npm run build
        working-directory: frontend
      - run: uv run pytest -q tests/test_dashboard_api.py tests/test_web_server.py
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [interaction, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.12
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - if: matrix.suite == 'interaction'
        run: npx playwright test
        working-directory: frontend
      - if: matrix.suite == 'integration'
        run: npx playwright test -c playwright.integration.config.ts
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.suite }}
          path: |
            .scratch/playwright-results
            .scratch/playwright-report
            .scratch/integration-results
            .scratch/integration-report
