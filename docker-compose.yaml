services:
  panoctagon_backend:
    build:
      context: .
      dockerfile: Dockerfile-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panoctagon_backend.rule=Host(`panoctagon.jeffbrennan.dev`) && PathPrefix(`/dagster`)"
      - "traefik.http.routers.panoctagon_backend.entrypoints=websecure"
      - "traefik.http.routers.panoctagon_backend.tls.certresolver=myresolver"
      - "traefik.http.routers.panoctagon_backend.middlewares=panoctagon-auth"
      - "traefik.http.middlewares.panoctagon-auth.basicauth.users=${BACKEND_ADMIN}:$$2y$$10$$umYUP5LKzZs.gHLg0hqExOrwdgrNaVmhnCALnjJ90zYoRZvfc1nxe"
      - "traefik.http.services.panoctagon_backend.loadbalancer.server.port=3000"
    volumes:
      - panoctagon_data:/panoctagon/data
      - panoctagon_target:/panoctagon/target
    networks:
      - jb-proxy
    depends_on:
      - panoctagon_code_server
    entrypoint: ["sh", "-c", "until [ -f target/manifest.json ]; do echo 'waiting for dbt manifest...'; sleep 2; done && uv run dagster-webserver -h 0.0.0.0 -p 3000 --path-prefix /dagster -w /panoctagon/data/workspace.yaml"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3000/dagster/server_info')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  panoctagon_daemon:
    build:
      context: .
      dockerfile: Dockerfile-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["sh", "-c", "uv run dbt compile --profiles-dir . && uv run dagster instance concurrency set duckdb_write 1 && uv run dagster-daemon run -w /panoctagon/data/workspace.yaml"]
    volumes:
      - panoctagon_data:/panoctagon/data
      - panoctagon_target:/panoctagon/target
    networks:
      - jb-proxy
    depends_on:
      - panoctagon_code_server

  panoctagon_code_server:
    build:
      context: .
      dockerfile: Dockerfile-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["sh", "-c", "until [ -f target/manifest.json ]; do echo 'waiting for dbt manifest...'; sleep 2; done && uv run dagster code-server start --host 0.0.0.0 --port 4000 -m panoctagon.dagster.definitions -d /panoctagon"]
    volumes:
      - panoctagon_data:/panoctagon/data
      - panoctagon_target:/panoctagon/target
    networks:
      - jb-proxy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 4000), 5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  panoctagon_api:
    build:
      context: .
      dockerfile: Dockerfile-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panoctagon_api.rule=Host(`panoctagon.jeffbrennan.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.panoctagon_api.entrypoints=websecure"
      - "traefik.http.routers.panoctagon_api.tls.certresolver=myresolver"
      - "traefik.http.routers.panoctagon_api.middlewares=panoctagon-api-strip"
      - "traefik.http.middlewares.panoctagon-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.panoctagon_api.loadbalancer.server.port=8000"
    volumes:
      - panoctagon_data:/panoctagon/data
    networks:
      - jb-proxy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  panoctagon_frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.panoctagon_frontend.rule=Host(`panoctagon.jeffbrennan.dev`)"
      - "traefik.http.routers.panoctagon_frontend.entrypoints=websecure"
      - "traefik.http.routers.panoctagon_frontend.tls.certresolver=myresolver"
      - "traefik.http.routers.panoctagon_frontend.priority=1"
      - "traefik.http.services.panoctagon_frontend.loadbalancer.server.port=8050"
    volumes:
      - panoctagon_data:/panoctagon/data
    networks:
      - jb-proxy
    command: ["--workers", "2"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8050/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  panoctagon_data:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "data"
  panoctagon_target:
    driver: local

networks:
  jb-proxy:
    external: true
