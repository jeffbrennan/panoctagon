# Opt in with: docker compose -f docker-compose.yaml -f docker-compose.svelte.yaml ...
services:
  panoctagon_api:
    environment:
      PANOCTAGON_API_SNAPSHOT_DIR: /panoctagon/data/api_snapshots
      PANOCTAGON_API_HEADSHOTS: /panoctagon/data/raw/ufc/fighter_headshots
    volumes:
      - panoctagon_data:/panoctagon/data:ro
    labels:
      traefik.enable: "false"
  panoctagon_frontend:
    environment:
      PANOCTAGON_API_SNAPSHOT_DIR: /panoctagon/data/api_snapshots
      PANOCTAGON_API_HEADSHOTS: /panoctagon/data/raw/ufc/fighter_headshots
    volumes:
      - panoctagon_data:/panoctagon/data:ro
    command: []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8050/readyz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
